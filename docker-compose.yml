services:
  rapid7-bulk-export-mcp:
    build: .
    image: rapid7-bulk-export-mcp
    container_name: rapid7-bulk-export-mcp
    ports:
      # Bound to localhost only — put a Cloudflare Tunnel (or reverse proxy)
      # in front rather than exposing this port to the internet directly,
      # since the /mcp endpoint has no authentication of its own.
      - "127.0.0.1:8000:8000"
    environment:
      - RAPID7_API_KEY=${RAPID7_API_KEY:-}
      - RAPID7_MULTI_TENANT_API_KEY=${RAPID7_MULTI_TENANT_API_KEY:-}
      - RAPID7_PARENT_ORG_ID=${RAPID7_PARENT_ORG_ID:-}
      - RAPID7_REGION=${RAPID7_REGION}
      - MCP_TRANSPORT=http
      - DATA_DIR=/opt/data/bulk-export
      - TMPDIR=/tmp
      # Runs daily_sync in-process on a schedule instead of a separate host
      # cron job, so every write stays under this container's own uid.
      - ENABLE_DAILY_SYNC=true
      - DAILY_SYNC_HOUR_UTC=${DAILY_SYNC_HOUR_UTC:-2}
      - DAILY_SYNC_MINUTE_UTC=${DAILY_SYNC_MINUTE_UTC:-0}
    volumes:
      - /opt/data/bulk-export:/opt/data/bulk-export
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
